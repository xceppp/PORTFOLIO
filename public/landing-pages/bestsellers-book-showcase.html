<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15171a">
  <meta
    name="description"
    content="An earth-toned interactive field library for Codex, Claude Code, and Cursor."
  >
  <title>Pilotage — Trois axes de direction</title>
  <style>
    :root {
      --ink: #0f1113;
      --ink-deep: #15171a;
      --ink-soft: #1c1f23;
      --pink: #c29a5b;
      --pink-bright: #d4b57a;
      --text: #ececea;
      --muted: #a3a6a9;
      --periwinkle: #c29a5b;
      --sage: #3fa7a0;
      --clay: #c29a5b;
      --moss: #2a5f5b;
      --paper: #1c1f23;
      --serif: "Geist", "Geist Variable", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      --ease: cubic-bezier(.2, .78, .2, 1);
      --mx: 0px;
      --my: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--text);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background: transparent;
    }

    .stage::after {
      content: "";
      position: absolute;
      z-index: 30;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .topbar {
      position: fixed;
      z-index: 50;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 26px 3.2vw;
      pointer-events: none;
    }

    .brand {
      color: var(--pink);
      font-size: clamp(23px, 2.1vw, 30px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: -.035em;
      line-height: 1;
      text-decoration: none;
      pointer-events: auto;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .icon-button,
    .ticket-button,
    .close-button,
    .pill,
    .book-card {
      border: 0;
      outline: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button,
    .ticket-button {
      height: 50px;
      border: 1px solid rgba(236, 236, 234, .12);
      background: color-mix(in srgb, var(--ink-soft) 92%, #fff 8%);
      color: var(--text);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .28);
      transition: transform 240ms var(--ease), background-color 240ms ease;
    }

    .icon-button {
      display: grid;
      width: 50px;
      place-items: center;
      border-radius: 50%;
      cursor: pointer;
    }

    .menu-glyph {
      position: relative;
      width: 14px;
      height: 10px;
    }

    .menu-glyph::before,
    .menu-glyph::after {
      content: "";
      position: absolute;
      left: 1px;
      width: 12px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transition: transform 300ms var(--ease), top 300ms var(--ease);
    }

    .menu-glyph::before {
      top: 2px;
    }

    .menu-glyph::after {
      top: 7px;
    }

    [data-menu="open"] .menu-glyph::before {
      top: 5px;
      transform: rotate(45deg);
    }

    [data-menu="open"] .menu-glyph::after {
      top: 5px;
      transform: rotate(-45deg);
    }

    .ticket-button {
      display: inline-grid;
      min-width: 138px;
      padding: 0 25px;
      place-items: center;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .icon-button:hover,
    .ticket-button:hover {
      transform: translateY(-3px);
      background: color-mix(in srgb, var(--ink-soft) 80%, var(--pink) 20%);
    }

    .icon-button:focus-visible,
    .ticket-button:focus-visible,
    .close-button:focus-visible,
    .pill:focus-visible,
    .menu-link:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .hero-word {
      position: absolute;
      z-index: 1;
      top: 11.5vh;
      left: 50%;
      margin: 0;
      color: var(--pink);
      font-size: clamp(184px, 22vw, 325px);
      font-style: italic;
      font-weight: 500;
      letter-spacing: -.085em;
      line-height: .84;
      white-space: nowrap;
      transform: translate3d(calc(-50% + var(--mx) * -.12), calc(var(--my) * -.12), 0);
      transition: opacity 700ms ease, filter 700ms ease, transform 900ms var(--ease);
      user-select: none;
    }

    .gallery {
      position: absolute;
      z-index: 5;
      inset: 0;
      perspective: 1400px;
      transform-style: flat;
    }

    .book-card {
      --hover-y: 0px;
      --local-x: 0px;
      --local-y: 0px;
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      aspect-ratio: .672 / 1;
      padding: 0;
      background: transparent;
      cursor: pointer;
      transform:
        translate3d(
          calc(-50% + var(--local-x)),
          calc(var(--hover-y) + var(--local-y)),
          0
        )
        rotate(var(--r))
        rotateY(var(--yaw));
      transform-style: preserve-3d;
      transition:
        left 1100ms var(--ease),
        top 1100ms var(--ease),
        width 1100ms var(--ease),
        opacity 500ms ease,
        filter 500ms ease,
        transform 520ms var(--ease);
      will-change: transform, left, top, width;
    }

    .book-card[data-book="codex"] {
      --x: 23.2%;
      --y: 40.5%;
      --w: min(30.5vw, 435px);
      --r: -8deg;
      --yaw: -7deg;
      z-index: 1;
    }

    .book-card[data-book="claude"] {
      --x: 50%;
      --y: 32.2%;
      --w: min(33vw, 470px);
      --r: .8deg;
      --yaw: -3deg;
      z-index: 3;
    }

    .book-card[data-book="cursor"] {
      --x: 77%;
      --y: 42%;
      --w: min(30.5vw, 435px);
      --r: 8deg;
      --yaw: 7deg;
      z-index: 2;
    }

    .book-card:hover,
    .book-card[data-hovered="true"] {
      --hover-y: -28px;
      z-index: 8;
    }

    .book {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 800ms var(--ease);
    }

    .book-card:hover .book {
      transform: scale(1.035) rotateX(-1.5deg);
    }

    .book-back,
    .page-block,
    .page-fan,
    .front-cover,
    .book-shadow {
      position: absolute;
      inset: 0;
      border-radius: 3px 7px 7px 3px;
    }

    .book-shadow {
      z-index: -2;
      inset: 5% -4% -2% 4%;
      border-radius: 12px;
      background: rgba(24, 18, 10, .7);
      filter: blur(22px);
      opacity: .72;
      transform: translate3d(18px, 28px, -60px);
    }

    .book-back {
      z-index: 0;
      background: var(--cover-color);
      box-shadow: 0 18px 30px rgba(24, 18, 10, .4);
      transform: translate3d(7px, 1px, -26px);
    }

    .page-block {
      z-index: 1;
      inset: 1.7% 1.4% 1.7% 3.8%;
      overflow: visible;
      border: 1px solid rgba(84, 68, 45, .25);
      border-radius: 2px 5px 5px 2px;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(105, 86, 58, .14) 0,
          rgba(105, 86, 58, .14) 1px,
          transparent 1px,
          transparent 2.8px
        ),
        linear-gradient(90deg, #cfc1a4 0%, #f2e8d2 14%, #e7dac0 87%, #cbb894 100%);
      box-shadow: 7px 5px 16px rgba(31, 23, 13, .26);
      transform: translate3d(7px, 1px, -12px);
      transition: transform 1100ms var(--ease), inset 1100ms var(--ease);
    }

    .page-block::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 1px;
      left: 1px;
      height: 8px;
      border-radius: 2px 4px 0 0;
      background:
        repeating-linear-gradient(
          90deg,
          #d9cbae 0,
          #d9cbae 2px,
          #f2e7cf 2px,
          #f2e7cf 5px
        );
      transform: skewX(-8deg);
      transform-origin: bottom left;
    }

    .page-block::after {
      content: "";
      position: absolute;
      top: 0;
      right: -7px;
      width: 8px;
      height: 100%;
      border-radius: 0 4px 4px 0;
      background:
        repeating-linear-gradient(
          0deg,
          #cbb995 0,
          #cbb995 1px,
          #eee3cd 1px,
          #eee3cd 3px
        );
      box-shadow: 3px 2px 7px rgba(35, 26, 14, .18);
      transform: skewY(-2deg);
      transform-origin: left center;
    }

    .page-fan {
      z-index: 2;
      inset: 2.4% 2% 2.4% 4.3%;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .page-fan i {
      position: absolute;
      inset: 0;
      display: block;
      border: 1px solid rgba(102, 83, 55, .22);
      border-radius: 2px 5px 5px 2px;
      background:
        linear-gradient(90deg, rgba(116, 91, 56, .22), transparent 9%),
        repeating-linear-gradient(
          0deg,
          #f0e6d0 0,
          #f0e6d0 2px,
          #e6d8ba 2px,
          #e6d8ba 3px
        );
      box-shadow: 3px 5px 10px rgba(37, 28, 16, .08);
      opacity: 0;
      transform: translate3d(0, 0, 0) rotateY(0);
      transform-origin: 1.5% center;
      transition: opacity 500ms ease, transform 1200ms var(--ease);
    }

    .front-cover {
      z-index: 3;
      overflow: hidden;
      border: 1px solid rgba(238, 224, 194, .2);
      background-color: var(--cover-color);
      background-image: var(--cover);
      background-position: center;
      background-size: cover;
      box-shadow:
        0 25px 38px rgba(24, 18, 10, .4),
        inset -12px 0 18px rgba(0, 0, 0, .16),
        inset 4px 0 9px rgba(255, 255, 255, .12);
      transform: translate3d(0, 0, 12px);
      transform-origin: 1.5% center;
      transform-style: preserve-3d;
      transition: transform 1200ms var(--ease), box-shadow 600ms ease;
    }

    .front-cover::before {
      content: "";
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: 0;
      width: 5.5%;
      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, .35),
          rgba(255, 255, 255, .08) 35%,
          rgba(0, 0, 0, .12) 75%,
          transparent
        );
      mix-blend-mode: multiply;
      opacity: .8;
    }

    .front-cover::after {
      content: "";
      position: absolute;
      z-index: 4;
      inset: 0;
      border: 3px solid rgba(255, 255, 255, .04);
      border-radius: inherit;
      pointer-events: none;
    }

    .cover-motion {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 420ms ease;
      pointer-events: none;
    }

    .cover-motion[data-ready="true"] {
      opacity: 1;
    }

    .cover-copy {
      position: absolute;
      z-index: 2;
      inset: 5.8% 7.5% 5.5%;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      align-content: start;
      color: var(--cover-ink);
      text-align: center;
      text-shadow: 0 1px 0 rgba(241, 226, 196, .24);
    }

    .cover-kicker {
      font-size: clamp(8px, .72vw, 11px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .cover-title {
      margin-top: 2.2%;
      font-size: clamp(35px, 4.3vw, 64px);
      font-weight: 600;
      letter-spacing: -.055em;
      line-height: .9;
    }

    .cover-subtitle {
      margin-top: 3%;
      font-size: clamp(10px, 1.05vw, 15px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: .035em;
    }

    .cover-footer {
      align-self: end;
      padding-top: 3%;
      border-top: 1px solid currentColor;
      font-size: clamp(7px, .62vw, 9px);
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .book-card[data-book="codex"] .cover-copy {
      --cover-ink: #1c1f23;
    }

    .book-card[data-book="claude"] .cover-copy {
      --cover-ink: #15171a;
    }

    .book-card[data-book="cursor"] .cover-copy {
      --cover-ink: #0f1113;
    }

    .open-badge {
      position: absolute;
      z-index: 6;
      top: 47%;
      left: 50%;
      display: grid;
      width: 94px;
      height: 66px;
      place-items: center;
      color: #312a21;
      background: #efe3ca;
      clip-path: polygon(
        3% 22%, 10% 8%, 25% 7%, 38% 1%, 51% 6%, 66% 2%,
        77% 10%, 92% 11%, 96% 26%, 100% 39%, 95% 52%, 99% 67%,
        88% 79%, 83% 93%, 68% 94%, 55% 100%, 42% 94%, 27% 98%,
        17% 88%, 4% 84%, 5% 69%, 0 57%, 5% 43%, 1% 34%
      );
      font-size: 11px;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .12em;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.76) rotate(-3deg);
      transition: opacity 260ms ease, transform 420ms var(--ease), filter 260ms ease;
      pointer-events: none;
    }

    .book-card:hover .open-badge,
    .book-card[data-hovered="true"] .open-badge,
    .book-card:focus-visible .open-badge {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(-3deg);
    }

    .book-card:focus-visible {
      outline: 0;
    }

    .book-card:focus-visible .open-badge {
      filter:
        drop-shadow(0 7px 12px rgba(29, 22, 14, .34))
        drop-shadow(0 0 8px rgba(224, 190, 137, .28));
    }

    .detail-panel {
      position: absolute;
      z-index: 12;
      top: 14.5%;
      right: 4.5%;
      width: min(47.5%, 650px);
      opacity: 0;
      transition: opacity 520ms ease 280ms;
      pointer-events: none;
    }

    .detail-title {
      margin: 0 0 24px;
      color: var(--pink);
      font-size: clamp(52px, 5.7vw, 82px);
      font-style: italic;
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: .96;
    }

    .detail-description {
      max-width: 600px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.28vw, 17px);
      line-height: 1.64;
    }

    .detail-scroll {
      max-height: clamp(340px, calc(100svh - 450px), 600px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 22px 76px 0;
      -webkit-mask-image: linear-gradient(
        to bottom,
        #000 0,
        #000 calc(100% - 76px),
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        #000 0,
        #000 calc(100% - 76px),
        transparent 100%
      );
      scrollbar-color: rgba(198, 139, 140, .76) rgba(73, 66, 49, .35);
      scrollbar-width: thin;
    }

    .detail-scroll:focus-visible {
      border-radius: 8px;
      outline: 1px solid rgba(231, 184, 185, .7);
      outline-offset: 8px;
    }

    .detail-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .detail-scroll::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(73, 66, 49, .35);
    }

    .detail-scroll::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(198, 139, 140, .76);
    }

    .doc-section {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid rgba(220, 200, 164, .2);
    }

    .doc-label {
      margin: 0 0 16px;
      color: var(--pink);
      font-size: 12px;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .doc-steps {
      display: grid;
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: guide-step;
    }

    .doc-steps li {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      counter-increment: guide-step;
    }

    .doc-steps li::before {
      content: counter(guide-step, decimal-leading-zero);
      padding-top: 2px;
      color: rgba(231, 184, 185, .7);
      font-size: 12px;
      font-style: italic;
      letter-spacing: .08em;
    }

    .doc-step-copy {
      display: grid;
      gap: 4px;
    }

    .doc-step-copy strong {
      color: #e8dcc4;
      font-size: 15px;
      font-style: italic;
      font-weight: 650;
    }

    .doc-step-copy span,
    .doc-review {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.58;
    }

    .prompt-block {
      padding: 17px 18px;
      border: 1px solid rgba(220, 200, 164, .2);
      border-radius: 12px;
      background: rgba(52, 48, 37, .62);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035);
    }

    .prompt-block code {
      color: #e8dcc4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.58;
      white-space: pre-wrap;
    }

    .doc-review {
      margin: 0;
    }

    .meta-row {
      display: grid;
      grid-template-columns: max-content 1px max-content 1fr;
      align-items: center;
      gap: clamp(16px, 2vw, 27px);
      margin-top: 22px;
      color: var(--pink);
    }

    .stars {
      display: flex;
      gap: 8px;
      font-size: 24px;
      letter-spacing: .02em;
      line-height: 1;
    }

    .stars .dim {
      color: #665f4d;
    }

    .meta-divider {
      width: 1px;
      height: 26px;
      background: rgba(220, 200, 164, .28);
    }

    .review-source,
    .year {
      color: #bcae92;
      font-size: 18px;
      font-style: italic;
      font-weight: 650;
    }

    .year {
      justify-self: end;
    }

    .detail-rule {
      height: 1px;
      margin: 10px 0 22px;
      border: 0;
      background: rgba(220, 200, 164, .24);
    }

    .bottom-dock {
      position: fixed;
      z-index: 24;
      right: 4.5%;
      bottom: 28px;
      width: min(47.5%, 650px);
    }

    .bottom-dock .meta-row {
      margin: 0 10px;
    }

    .bottom-dock .detail-rule {
      margin: 10px 8px 14px;
    }

    .action-rail {
      --action-inset: 8px;
      display: flex;
      align-items: center;
      gap: var(--action-inset);
      width: 100%;
      padding: var(--action-inset);
      border: 1px solid rgba(238, 226, 202, .07);
      border-radius: 32px;
      background: rgba(64, 58, 43, .88);
      box-shadow: 0 16px 32px rgba(26, 20, 12, .2);
      backdrop-filter: blur(12px);
    }

    .pill {
      display: inline-flex;
      flex: 1 1 0;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 58px;
      padding: 0 18px;
      border-radius: 24px;
      background: var(--periwinkle);
      color: #2e261d;
      cursor: pointer;
      font-size: 15px;
      font-style: italic;
      font-weight: 700;
      white-space: nowrap;
      transition: transform 220ms var(--ease), filter 220ms ease, background 220ms ease;
    }

    .pill:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .pill.language {
      gap: 10px;
      background: var(--paper);
    }

    .pill.language svg {
      width: 19px;
      height: 19px;
    }

    .pill.icon-only {
      flex: 0 0 58px;
      width: 58px;
      min-width: 58px;
      padding: 0;
      background: #565d45;
      color: #f1e6cf;
    }

    .pill.icon-only svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      transition: fill 220ms ease;
    }

    .pill.icon-only[aria-pressed="true"] svg {
      fill: var(--pink);
      stroke: var(--pink);
    }

    .close-button {
      position: absolute;
      z-index: 52;
      top: 30px;
      left: 50%;
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 50%;

    .blossom {
      --blossom-size: 26px;
      position: absolute;
      top: -12vh;
      left: var(--blossom-x);
      width: var(--blossom-size);
      height: var(--blossom-size);
      opacity: .92;
      transform-style: preserve-3d;
      animation: blossomFall var(--blossom-duration) linear var(--blossom-delay) infinite;
    }

    .blossom i {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 42%;
      height: 60%;
      border-radius: 72% 72% 58% 58%;
      background:
        radial-gradient(circle at 50% 82%, rgba(187, 103, 108, .9) 0 10%, transparent 11%),
        linear-gradient(180deg, #f5d8d3 0%, #e6aaa9 74%, #c78184 100%);
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .42);
      transform-origin: 50% 100%;
    }

    .blossom i:nth-child(1) {
      transform: translate(-50%, -100%) rotate(0deg);
    }

    .blossom i:nth-child(2) {
      transform: translate(-50%, -100%) rotate(72deg);
    }

    .blossom i:nth-child(3) {
      transform: translate(-50%, -100%) rotate(144deg);
    }

    .blossom i:nth-child(4) {
      transform: translate(-50%, -100%) rotate(216deg);
    }

    .blossom i:nth-child(5) {
      transform: translate(-50%, -100%) rotate(288deg);
    }

    .blossom::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background: #d9b46f;
      box-shadow: 0 0 0 2px rgba(107, 70, 51, .18);
      transform: translate(-50%, -50%);
    }

    @keyframes blossomFall {
      0% {
        transform: translate3d(0, -10vh, 0) rotateX(18deg) rotateZ(var(--blossom-r));

      32% {
        transform: translate3d(36px, 34vh, 0) rotateX(154deg) rotateZ(calc(var(--blossom-r) + 126deg));
      }
      68% {
        transform: translate3d(-30px, 78vh, 0) rotateX(284deg) rotateZ(calc(var(--blossom-r) + 272deg));
      }
      100% {
        transform: translate3d(20px, 122vh, 0) rotateX(430deg) rotateZ(calc(var(--blossom-r) + 430deg));
      }
    }

  <main class="stage" aria-label="Bibliothèque des axes de pilotage">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Pilotage EST Meknès">Pilotage</a>
      <div class="nav-actions">
        <button class="icon-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false">
          <span class="menu-glyph" aria-hidden="true"></span>
        </button>
        <button class="ticket-button" type="button" data-toast="Trois axes de direction institutionnelle.">Les trois axes</button>
      </div>
    </header>

    <h1 class="hero-word" aria-hidden="true">Axes</h1>

    <section class="gallery" aria-label="Axes de pilotage institutionnel">
      <button
        class="book-card"
        type="button"
        data-book="codex"
        aria-label="Ouvrir Projets structurants"
        style="
          --cover-color: #1a221c;
          --cover: url('/landing-pages/covers/cover-projets.jpg');
        "
      >
        <span class="book" aria-hidden="true">
          <span class="book-shadow"></span>
          <span class="book-back"></span>
          <span class="page-block"></span>
          <span class="page-fan"><i></i><i></i><i></i><i></i></span>
          <span class="front-cover">
            <!-- cover-motion removed for performance -->
            <span class="cover-copy">
              <span class="cover-kicker">Pilotage · I</span>
              <span class="cover-title">Projets</span>
              <span class="cover-subtitle">Structurants</span>
              <span></span>
              <span class="cover-footer">Numérique · Formation · Qualité</span>
            </span>
          </span>
          <span class="open-badge">Lire</span>
        </span>
      </button>

      <button
        class="book-card"
        type="button"
        data-book="claude"
        aria-label="Ouvrir Gouvernance"
        style="
          --cover-color: #1c1812;
          --cover: url('/landing-pages/covers/cover-gouvernance.jpg');
        "
      >
        <span class="book" aria-hidden="true">
          <span class="book-shadow"></span>
          <span class="book-back"></span>
          <span class="page-block"></span>
          <span class="page-fan"><i></i><i></i><i></i><i></i></span>
          <span class="front-cover">
            <!-- cover-motion removed for performance -->
            <span class="cover-copy">
              <span class="cover-kicker">Pilotage · II</span>
              <span class="cover-title">Gouvernance</span>
              <span class="cover-subtitle">Institutionnelle</span>
              <span></span>
              <span class="cover-footer">Conseils · Commissions · Animation</span>
            </span>
          </span>
          <span class="open-badge">Lire</span>
        </span>
      </button>

      <button
        class="book-card"
        type="button"
        data-book="cursor"
        aria-label="Ouvrir Partenariats"
        style="
          --cover-color: #121a1c;
          --cover: url('/landing-pages/covers/cover-partenaires.jpg');
        "
      >
        <span class="book" aria-hidden="true">
          <span class="book-shadow"></span>
          <span class="book-back"></span>
          <span class="page-block"></span>
          <span class="page-fan"><i></i><i></i><i></i><i></i></span>
          <span class="front-cover">
            <!-- cover-motion removed for performance -->
            <span class="cover-copy">
              <span class="cover-kicker">Pilotage · III</span>
              <span class="cover-title">Partenaires</span>
              <span class="cover-subtitle">International</span>
              <span></span>
              <span class="cover-footer">Coopération · Doubles diplômes</span>
            </span>
          </span>
          <span class="open-badge">Lire</span>
        </span>
      </button>
    </section>

    <section class="detail-panel" id="detailPanel" aria-live="polite" aria-hidden="true" inert>
      <h2 class="detail-title" id="detailTitle">Gouvernance</h2>
      <div class="detail-scroll" id="detailScroll" tabindex="0" aria-label="Détails de l'axe">
        <p class="detail-description" id="detailDescription"></p>
        <section class="doc-section" aria-labelledby="gettingStartedLabel">
          <p class="doc-label" id="gettingStartedLabel">Détails de l'axe</p>
          <ol class="doc-steps" id="detailSteps"></ol>
        </section>
        <section class="doc-section" aria-labelledby="firstPromptLabel">
          <p class="doc-label" id="firstPromptLabel">Point d'ancrage</p>
          <div class="prompt-block"><code id="detailPrompt"></code></div>
        </section>
        <section class="doc-section" aria-labelledby="reviewLabel">
          <p class="doc-label" id="reviewLabel">Lecture</p>
          <p class="doc-review" id="detailReview"></p>
        </section>
      </div>
      <div class="bottom-dock">
        <div class="meta-row" aria-label="Édition et année">
          <div class="stars" aria-label="Édition">
            <span>✦</span><span>✦</span><span>✦</span><span>✦</span><span class="dim">◇</span>
          </div>
          <span class="meta-divider" aria-hidden="true"></span>
          <span class="review-source">Direction EST</span>
          <span class="year" id="detailYear">2026</span>
        </div>
        <hr class="detail-rule">
        <div class="action-rail" aria-label="Actions de l'axe">
          <button class="pill language" type="button" data-toast="Direction EST · 2026">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M3 12h18M12 3c2.2 2.4 3.3 5.4 3.3 9S14.2 18.6 12 21c-2.2-2.4-3.3-5.4-3.3-9S9.8 5.4 12 3Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
            </svg>
            Direction EST
          </button>
          <button class="pill" type="button" data-toast="Notes ouvertes.">Lire les notes</button>
          <button class="pill" type="button" data-toast="Guide ouvert.">Voir le guide</button>
          <button class="pill icon-only" id="saveButton" type="button" aria-label="Enregistrer l'axe" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.8 4.2h10.4v15.6L12 16.6l-5.2 3.2V4.2Z"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <button class="close-button" id="closeButton" type="button" aria-label="Fermer le détail" tabindex="-1">×</button>

    <nav class="menu-layer" id="menuLayer" aria-label="Axes de pilotage" inert>
      <ul class="menu-list">
        <li><a class="menu-link" href="#" data-menu-close data-select-book="codex">Projets</a></li>
        <li><a class="menu-link" href="#" data-menu-close data-select-book="claude">Gouvernance</a></li>
        <li><a class="menu-link" href="#" data-menu-close data-select-book="cursor">Partenaires</a></li>
      </ul>
    </nav>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const books = {
        codex: {
          title: "Projets structurants",
          year: "2026",
          description:
            "Quatre chantiers de direction pour transformer l'EST de Meknès : numérique, formations professionnalisantes, management industriel et qualité de la réussite étudiante.",
          steps: [
            {
              title: "Smart Digital EST",
              body: "Écosystème intégré pour les notes, les délibérations, les ressources humaines, l'inventaire et l'infrastructure réseau."
            },
            {
              title: "Industrie 4.0 & formations professionnalisantes",
              body: "Développement de parcours alignés sur les mutations industrielles et les besoins du territoire."
            },
            {
              title: "Management Industriel & Ingénierie",
              body: "Programme Bac+5 conçu pour renforcer les compétences des cadres et professionnels de l'industrie."
            },
            {
              title: "Qualité et réussite étudiante",
              body: "Processus académiques lisibles, suivi régulier et culture de décision fondée sur les données."
            }
          ],
          prompt:
            "Priorité 2026 — déployer Smart Digital EST comme socle commun de gouvernance et de service aux étudiants.",
          review:
            "Mesurer l'impact sur la fluidité administrative, la lisibilité pédagogique et la capacité de décision de l'établissement."
        },
        claude: {
          title: "Gouvernance",
          year: "2026",
          description:
            "Engagements institutionnels, conseils et animation scientifique qui structurent le pilotage de l'EST et la coopération universitaire.",
          steps: [
            {
              title: "Conseils & commissions",
              body: "Membre du Conseil de l'Université USMBA (2018–2020 et 2025–2026), des commissions des affaires académiques et pédagogiques, et de la recherche et de la coopération. Membre élu du conseil de gestion en 2018 et 2019."
            },
            {
              title: "Gouvernance de l'ENSA Fès",
              body: "Participation au conseil d'établissement, aux commissions pédagogique, scientifique et de suivi du budget, aux comités paritaires (2021–2026), ainsi qu'à l'élaboration des règlements intérieurs en 2021–2022."
            },
            {
              title: "Animation scientifique",
              body: "Chair de CIMSI 2016, des journées de recherche inter-laboratoires et du Workshop on Complex Systems Engineering 2018. Organisation des congrès ICECS en 2021 et 2023 ; activités éditoriales et évaluation de manuscrits."
            },
            {
              title: "Engagement associatif",
              body: "Participation aux associations AMID et AMTI, à l'Association des Œuvres Sociales de l'ENSA Fès et à la fondation du Centre de réflexion, de recherche et de proposition (2022)."
            }
          ],
          prompt:
            "Tenir ensemble conseil, commissions et animation scientifique pour une gouvernance lisible et partagée.",
          review:
            "Vérifier la continuité des mandats, la traçabilité des décisions et la contribution à la communauté universitaire."
        },
        cursor: {
          title: "Partenariats",
          year: "2026",
          description:
            "Coopérations scientifiques et doubles diplômes qui relient l'EST de Meknès à des partenaires marocains, tunisiens et français.",
          steps: [
            {
              title: "Coopération maroco-tunisienne",
              body: "2017–2019 — Ingénierie des systèmes multiphysiques appliquée aux énergies renouvelables multisources (éolien, photovoltaïque)."
            },
            {
              title: "Smart Medina & intelligence artificielle",
              body: "2020–2022 — Projet Alkhawarizmi Smart Medina ; projet d'IA pour la gestion de la thérapie nutritionnelle appliquée au diabète de type 2."
            },
            {
              title: "Double diplomation avec le CNAM",
              body: "Double diplomation de formation continue Bac+3 avec le Conservatoire national des arts et métiers ; coordination de la formation de coordinateur technique pour l'optimisation des énergies renouvelables."
            },
            {
              title: "Échanges & doubles diplômes",
              body: "Conventions avec l'école d'ingénieurs de l'Université du Littoral Côte d'Opale (ULCO) et l'École Nationale Supérieure d'Ingénieurs du Mans (ENSIM)."
            }
          ],
          prompt:
            "Consolider les doubles diplômes et les projets de coopération comme levier d'attractivité pour l'EST.",
          review:
            "Suivre la mise en œuvre des conventions, les flux d'étudiants et la valeur ajoutée pour les formations."
        }
      };

      const body = document.body;
      const stage = document.querySelector(".stage");
      const cards = [...document.querySelectorAll(".book-card")];
      const detailPanel = document.querySelector("#detailPanel");
      const detailTitle = document.querySelector("#detailTitle");
      const detailScroll = document.querySelector("#detailScroll");
      const detailDescription = document.querySelector("#detailDescription");
      const detailSteps = document.querySelector("#detailSteps");
      const detailPrompt = document.querySelector("#detailPrompt");
      const detailReview = document.querySelector("#detailReview");
      const detailYear = document.querySelector("#detailYear");
      const closeButton = document.querySelector("#closeButton");
      const menuButton = document.querySelector("#menuButton");
      const menuLayer = document.querySelector("#menuLayer");
      const saveButton = document.querySelector("#saveButton");
      const toast = document.querySelector("#toast");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const coverVideos = [...document.querySelectorAll(".cover-motion")];
      let selectedCard = null;
      let toastTimer = 0;
      let frame = 0;
      let pointerX = 0;
      let pointerY = 0;
      let pointerClientX = -10000;
      let pointerClientY = -10000;

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.dataset.show = "true";
        toastTimer = window.setTimeout(() => {
          toast.dataset.show = "false";
        }, 1800);
      }

      function syncCoverMotion() {
        coverVideos.forEach((video) => {
          const card = video.closest(".book-card");
          const isVisibleBook =
            body.dataset.mode === "gallery" ||
            (body.dataset.mode === "detail" && card === selectedCard);
          const shouldPlay =
            !reducedMotion.matches &&
            !document.hidden &&
            isVisibleBook;

          if (!shouldPlay) {
            video.pause();
            return;
          }

          const playRequest = video.play();
          if (playRequest) playRequest.catch(() => {});
        });
      }

      function updateParallax() {
        frame = 0;
        if (reducedMotion.matches) return;

        if (body.dataset.mode === "detail" && selectedCard) {
          const bounds = selectedCard.getBoundingClientRect();
          const bookCenterX = bounds.left + bounds.width / 2;
          const bookCenterY = bounds.top + bounds.height / 2;
          const isPointerInViewport =
            pointerClientX >= 0 &&
            pointerClientX <= window.innerWidth &&
            pointerClientY >= 0 &&
            pointerClientY <= window.innerHeight;
          const horizontalReach = pointerClientX < bookCenterX
            ? Math.max(bookCenterX, 1)
            : Math.max(window.innerWidth - bookCenterX, 1);
          const verticalReach = pointerClientY < bookCenterY
            ? Math.max(bookCenterY, 1)
            : Math.max(window.innerHeight - bookCenterY, 1);
          const viewportX = isPointerInViewport
            ? Math.max(-1, Math.min(1, (pointerClientX - bookCenterX) / horizontalReach))
            : -5 / 16;
          const viewportY = isPointerInViewport
            ? Math.max(-1, Math.min(1, (pointerClientY - bookCenterY) / verticalReach))
            : 0;
          selectedCard.style.setProperty("--detail-yaw", `${viewportX * 16}deg`);
          selectedCard.style.setProperty("--detail-pitch", `${viewportY * -10}deg`);
          selectedCard.dataset.orbiting = String(isPointerInViewport);
          return;
        }

        if (body.dataset.mode !== "gallery") return;

        document.documentElement.style.setProperty("--mx", `${pointerX * 11}px`);
        document.documentElement.style.setProperty("--my", `${pointerY * 8}px`);

        cards.forEach((card, index) => {
          const depth = index === 1 ? 1 : .58;
          card.style.setProperty("--local-x", `${pointerX * 15 * depth}px`);
          card.style.setProperty("--local-y", `${pointerY * 9 * depth}px`);
        });
      }

      function selectBook(card) {
        const data = books[card.dataset.book];
        if (!data) return;
        if (body.dataset.mode === "detail" && selectedCard === card) return;

        selectedCard = card;
        focusIndex = Math.max(0, bookOrder.indexOf(card.dataset.book));
        setFocusIndex(focusIndex);
        selectedCard.style.setProperty("--detail-yaw", "-5deg");
        selectedCard.style.setProperty("--detail-pitch", "0deg");
        selectedCard.dataset.orbiting = "false";
        detailTitle.textContent = data.title;
        detailDescription.textContent = data.description;
        detailSteps.replaceChildren(...data.steps.map((step) => {
          const item = document.createElement("li");
          const copy = document.createElement("span");
          const title = document.createElement("strong");
          const bodyCopy = document.createElement("span");
          copy.className = "doc-step-copy";
          title.textContent = step.title;
          bodyCopy.textContent = step.body;
          copy.append(title, bodyCopy);
          item.append(copy);
          return item;
        }));
        detailPrompt.textContent = data.prompt;
        detailReview.textContent = data.review;
        detailScroll.scrollTop = 0;
        detailYear.textContent = data.year;
        cards.forEach((item) => item.classList.toggle("selected", item === card));
        cards.forEach((item) => { item.tabIndex = -1; });
        body.dataset.mode = "detail";
        syncCoverMotion();
        detailPanel.setAttribute("aria-hidden", "false");
        detailPanel.inert = false;
        closeButton.tabIndex = 0;
        saveButton.setAttribute("aria-pressed", "false");
        window.setTimeout(() => {
          closeButton.focus({ preventScroll: true });
          stage.scrollTop = 0;
          if (window.innerWidth <= 900) {
            detailScroll.scrollTop = 0;
            detailPanel.scrollTop = 0;
          }
        }, reducedMotion.matches ? 0 : 120);
      }

      function closeDetail() {
        if (body.dataset.mode !== "detail") return;
        body.dataset.mode = "gallery";
        syncCoverMotion();
        detailPanel.setAttribute("aria-hidden", "true");
        detailPanel.inert = true;
        closeButton.tabIndex = -1;
        const lastCard = selectedCard;
        lastCard?.style.setProperty("--detail-yaw", "-5deg");
        lastCard?.style.setProperty("--detail-pitch", "0deg");
        if (lastCard) lastCard.dataset.orbiting = "false";
        window.setTimeout(() => {
          cards.forEach((card) => card.classList.remove("selected"));
          cards.forEach((card) => { card.tabIndex = 0; });
          selectedCard = null;
          lastCard?.focus({ preventScroll: true });
          if (window.innerWidth > 900) stage.scrollTop = 0;
        }, reducedMotion.matches ? 0 : 700);
      }

      function toggleMenu(force) {
        const willOpen = typeof force === "boolean"
          ? force
          : body.dataset.menu !== "open";
        body.dataset.menu = willOpen ? "open" : "closed";
        menuLayer.inert = !willOpen;
        menuButton.setAttribute("aria-expanded", String(willOpen));
        menuButton.setAttribute("aria-label", willOpen ? "Close menu" : "Open menu");
      }

      const bookOrder = ["codex", "claude", "cursor"];

      let focusIndex = 1; // start on Gouvernance (center)

      function setFocusIndex(next) {
        focusIndex = (next + bookOrder.length) % bookOrder.length;
        const id = bookOrder[focusIndex];
        cards.forEach((card) => {
          const on = card.dataset.book === id;
          card.classList.toggle("is-focus", on);
          card.dataset.hovered = on ? "true" : "false";
          card.tabIndex = on ? 0 : -1;
        });
      }

      setFocusIndex(focusIndex);


      function cardByBook(id) {
        return cards.find((card) => card.dataset.book === id) || null;
      }

      function cycleBook(dir) {
        if (body.dataset.mode === "detail") {
          const currentId = selectedCard?.dataset?.book || bookOrder[focusIndex];
          const idx = Math.max(0, bookOrder.indexOf(currentId));
          const card = cardByBook(bookOrder[(idx + dir + bookOrder.length) % bookOrder.length]);
          if (card) {
            focusIndex = bookOrder.indexOf(card.dataset.book);
            setFocusIndex(focusIndex);
            selectBook(card);
          }
          return;
        }
        setFocusIndex(focusIndex + dir);
      }

      let swipeX = null;
      let swipeY = null;
      let swipeActive = false;

      stage.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        swipeX = event.clientX;
        swipeY = event.clientY;
        swipeActive = true;
      }, { passive: true });

      stage.addEventListener("pointerup", (event) => {
        if (!swipeActive || swipeX == null) return;
        const dx = event.clientX - swipeX;
        const dy = event.clientY - swipeY;
        swipeActive = false;
        swipeX = null;
        swipeY = null;
        if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.15) return;
        // Avoid stealing taps on buttons/links
        if (event.target.closest("button, a, .detail-scroll, .bottom-dock")) return;
        cycleBook(dx < 0 ? 1 : -1);
      }, { passive: true });

      stage.addEventListener("pointercancel", () => {
        swipeActive = false;
        swipeX = null;
        swipeY = null;
      });

      document.addEventListener("keydown", (event) => {
        if (body.dataset.menu === "open") return;
        if (event.key === "ArrowRight") {
          event.preventDefault();
          cycleBook(1);
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          cycleBook(-1);
        }
      });

      cards.forEach((card) => {
        card.addEventListener("click", () => selectBook(card));
        card.addEventListener("pointerenter", () => card.dataset.hovered = "true");
        card.addEventListener("pointerleave", () => card.dataset.hovered = "false");
      });

      coverVideos.forEach((video) => {
        const revealVideo = () => { video.dataset.ready = "true"; };
        if (video.readyState >= 2) {
          revealVideo();
        } else {
          video.addEventListener("loadeddata", revealVideo, { once: true });
        }
      });

      document.addEventListener("visibilitychange", syncCoverMotion);
      if (reducedMotion.addEventListener) {
        reducedMotion.addEventListener("change", syncCoverMotion);
      } else {
        reducedMotion.addListener(syncCoverMotion);
      }
      syncCoverMotion();

      const coarsePointer = window.matchMedia("(pointer: coarse)");
      window.addEventListener("pointermove", (event) => {
        if (coarsePointer.matches || window.innerWidth <= 900) return;
        pointerX = event.clientX / window.innerWidth - .5;
        pointerY = event.clientY / window.innerHeight - .5;
        pointerClientX = event.clientX;
        pointerClientY = event.clientY;
        if (!frame) frame = window.requestAnimationFrame(updateParallax);
      }, { passive: true });

      window.addEventListener("pointerleave", () => {
        pointerX = 0;
        pointerY = 0;
        pointerClientX = -10000;
        pointerClientY = -10000;
        if (!frame) frame = window.requestAnimationFrame(updateParallax);
      });

      closeButton.addEventListener("click", closeDetail);
      menuButton.addEventListener("click", () => toggleMenu());

      saveButton.addEventListener("click", () => {
        const saved = saveButton.getAttribute("aria-pressed") !== "true";
        saveButton.setAttribute("aria-pressed", String(saved));
        showToast(saved ? "Saved to your reading list." : "Removed from your reading list.");
      });

      document.addEventListener("click", (event) => {
        const toastTarget = event.target.closest("[data-toast]");
        if (toastTarget) {
          event.preventDefault();
          showToast(toastTarget.dataset.toast);
        }

        const menuClose = event.target.closest("[data-menu-close]");
        if (menuClose) {
          const bookId = menuClose.getAttribute("data-select-book");
          toggleMenu(false);
          if (bookId) {
            const card = cardByBook(bookId);
            if (card) selectBook(card);
          }
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (body.dataset.menu === "open") {
            toggleMenu(false);
          } else {
            closeDetail();
          }
        }
      });
    })();
  </script>
</body>
</html>
